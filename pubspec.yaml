name: restaurix
description: Restaurant management system — offline-first POS for Windows desktop.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  supabase_flutter: ^2.9.0
  uuid: ^4.5.1
  intl: ^0.20.2
  go_router: ^15.1.2
  freezed_annotation: ^2.4.4
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.2
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - .env.example
